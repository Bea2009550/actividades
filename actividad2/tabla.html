<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<!-- tr = fila -->
	<!-- th = celda de cabecera -->
	<!-- td = celda normal -->
	<!-- {border=""} = borde de la tabla -->
	<!-- rowspan = se unen dos filas -->
	<!-- colspan = se unen dos columnas -->
	<!-- {style="color:"} = cambiar color a la letras -->
	<!-- background-color = color del fondo -->


	<!-- Tabla de 4x3 -->
	<table border="1">
		<tr>
			<th colspan="2">Cabecera1-2</th>
			
			<th>Cabecera3</th>
		</tr>
		<tr>
			<td rowspan="2">a</td>
			<td>b</td>
			<td>c</td>
		</tr>
		<tr>
			
			<td>2</td>
			<td>3</td>
		</tr>
		<tr>
			<td>A</td>
			<td>B</td>
			<td>C</td>
		</tr>
	</table>
	
</body>
</html>
